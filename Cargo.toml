[package]
name = "asciitape"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A terminal UI player for asciinema v2 and v3 cast recordings"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/asciitape"
keywords = ["asciinema", "tui", "terminal", "cast", "player"]
categories = ["command-line-utilities"]

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0"
bzip2 = "0.6.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
flate2 = "1.1.9"
lz4_flex = "0.13.1"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xz2 = "0.1.7"
zstd = "0.13.3"
