[package]
name = "asciitape"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "A terminal UI player for asciinema v2 and v3 cast recordings"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/asciitape"
keywords = ["asciinema", "tui", "terminal", "cast", "player"]
categories = ["command-line-utilities"]

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
